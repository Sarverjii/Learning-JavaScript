<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>BlackJack</title>
</head>
<body>
    <div>
        <h1>BlackJack</h1>
        <h2 id="h2">Want to Play a Round?</h2>
        <h3 id="cards">Cards : </h3>
        <h3 id="sum">Sum : </h3>
        
        <div class="button-group">
            <button onclick="startGame()" id="startgame">Start Game</button>
            <button id="newcard" onclick="newCard()">New Card</button>
            <button id="finish" onclick="finishGame()">Finish</button>
            <button id="continue" onclick="continueGame()">Continue</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
